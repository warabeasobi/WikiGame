<!doctype html>
<html lang="id" data-type="software" data-radius="soft" data-buttons="arrow" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiRace: balapan lewat tautan Wikipedia di browser</title>
<meta name="description" content="Game browser gratis: mulai dari satu artikel Wikipedia, klik hanya tautan biru, dan capai artikel target dengan klik paling sedikit. Profil tersimpan lokal.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a0a0a">
<meta name="site-kind" content="gaming">
<meta name="page-type" content="software">
<script>
(function () {
  var d = document.documentElement, t = null;
  try { t = localStorage.getItem('wr-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  d.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/kit/backgrounds/backgrounds.css">

<link rel="stylesheet" href="/kit/icons/icon.css">
<link rel="stylesheet" href="/kit/diagrams/diagram.css">

<script src="/kit/backgrounds/backgrounds.js"></script>
<script>document.documentElement.classList.add('mo-js');setTimeout(function(){document.documentElement.classList.add('mo-safe')},2500)</script>
