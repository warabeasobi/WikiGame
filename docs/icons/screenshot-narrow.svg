<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Wikipedia Speedrun on mobile">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2c62d6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="#f6f7fb"/>
  <rect width="720" height="150" fill="url(#bg2)"/>
  <text x="36" y="70" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800" fill="#ffffff">🏁 Wikipedia Speedrun</text>
  <text x="36" y="118" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" fill="#e6edf3">Wikipedia is the map.</text>
  <rect x="24" y="180" width="672" height="120" rx="18" fill="#ffffff" stroke="#e2e5ee"/>
  <text x="48" y="222" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#6b7280">TIME</text>
  <text x="48" y="272" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="800" fill="#1a1d24">01:42.34</text>
  <text x="380" y="222" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#6b7280">CLICKS</text>
  <text x="380" y="272" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="800" fill="#1a1d24">7</text>
  <rect x="24" y="320" width="672" height="700" rx="18" fill="#ffffff" stroke="#e2e5ee"/>
  <text x="48" y="376" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#1a1d24">Banana</text>
  <g font-family="Georgia,serif" font-size="21" fill="#1a1d24">
    <text x="48" y="428">A banana is an elongated, edible fruit</text>
    <text x="48" y="458">produced by several kinds of large</text>
    <text x="48" y="488">herbaceous flowering plants in the</text>
    <text x="48" y="518">genus <tspan fill="#2c62d6" text-decoration="underline">Musa</tspan>.</text>
    <text x="48" y="578">The fruit is variable in size, colour</text>
    <text x="48" y="608">and firmness, and is eaten both raw</text>
    <text x="48" y="638">and cooked. <tspan fill="#2c62d6" text-decoration="underline">Plantains</tspan> are starchier.</text>
  </g>
  <rect x="24" y="1040" width="672" height="190" rx="18" fill="#ffffff" stroke="#e2e5ee"/>
  <text x="48" y="1088" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#1a1d24">Route</text>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" fill="#4b5261">
    <text x="48" y="1128">Banana</text>
    <text x="48" y="1160">↓</text>
    <text x="48" y="1192">Musaceae</text>
    <text x="300" y="1128">↓</text>
    <text x="300" y="1160">Fruit 🎯</text>
  </g>
</svg>
